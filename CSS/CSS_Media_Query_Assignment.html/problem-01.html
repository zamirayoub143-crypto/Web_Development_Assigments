<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem 1</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-areas:
                "nav nav nav nav"
                "box1 box2 box3 box4";

            gap: 10px;
        }

        .nav {
            grid-area: nav;
            background-color: yellow;
            height: 70px;
            padding: 10px;
            font-size: 30px;
        }

        .box {
            height: 160px;
            padding: 8px;
            font-size: 18px;
        }

        .box1 {
            grid-area: box1;
            background-color: red;
        }

        .box2 {
            grid-area: box2;
            background-color: #00ff20;
        }

        .box3 {
            grid-area: box3;
            background-color: #5865e8;
        }

        .box4 {
            grid-area: box4;
            background-color: #999;
        }

        /* Medium */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: repeat(2, 1fr);

                grid-template-areas:
                    "nav nav"
                    "box1 box3"
                    "box2 box4";
            }

            .nav {
                font-size: 30px;
            }

            .box {
                height: 200px;
            }
        }

        /* Small */
        @media (max-width: 600px) {
            body {
                padding: 20px;
            }

            .container {
                grid-template-columns: 1fr;

                grid-template-areas:
                    "nav"
                    "box1"
                    "box4"
                    "box2"
                    "box3";
            }

            .nav {
                height: 80px;
                font-size: 35px;
            }

            .box {
                height: 130px;
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="nav">Navigation</div>

        <div class="box box1">Box 1</div>

        <div class="box box2">Box 2</div>

        <div class="box box3">Box 3</div>

        <div class="box box4">Box 4</div>

    </div>

</body>
</html>
