<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem 3</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Georgia, serif;
            background: white;
        }

        .rooms {
            width: 90%;
            max-width: 1000px;
            margin: 60px auto;
            text-align: center;
        }

        .rooms h1 {
            color: #bd8931;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .rooms > p {
            max-width: 650px;
            margin: auto;
            color: #555;
            font-size: 11px;
            line-height: 1.6;
        }

        .room-container {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .room {
            flex: 1;
        }

        .room img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }

        .room h2 {
            margin-top: 10px;
            font-size: 16px;
        }

        .room span {
            display: block;
            margin-top: 8px;
            color: #d6a044;
            font-size: 10px;
        }

        /* Medium */
        @media (max-width: 900px) {

            .room-container {
                flex-wrap: wrap;
            }

            .room {
                flex: 0 0 calc(50% - 10px);
            }
        }

        /* Small */
        @media (max-width: 600px) {

            .room-container {
                flex-direction: column;
            }

            .room {
                width: 100%;
            }

            .room img {
                height: 230px;
            }
        }
    </style>
</head>

<body>

    <section class="rooms">

        <h1>Rooms & Suits</h1>

        <p>
            Far far away, behind the word mountains, far from
            the countries Vokalia and Consonantia, there live
            the blind texts. Separated they live in
            Bookmarksgrove.
        </p>


        <div class="room-container">

            <div class="room">

                <img
                    src="https://images.unsplash.com/photo-1566665797739-1674de7a421a?auto=format&fit=crop&w=600&q=80"
                    alt="Single Room">

                <h2>Single Room</h2>

                <span>
                    $95 / PER NIGHT
                </span>

            </div>


            <div class="room">

                <img
                    src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=600&q=80"
                    alt="Family Room">

                <h2>Family Room</h2>

                <span>
                    $1205 / PER NIGHT
                </span>

            </div>


            <div class="room">

                <img
                    src="https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=600&q=80"
                    alt="Presidential Room">

                <h2>Presidential Room</h2>

                <span>
                    $2505 / PER NIGHT
                </span>

            </div>

        </div>

    </section>

</body>
</html>
