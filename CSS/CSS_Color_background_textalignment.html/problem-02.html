<!DOCTYPE html>
<html>
<head>
    <title>Tasty Bites Restaurant</title>
</head>

<body style="margin:0; font-family:Arial; background-color:rgb(255, 245, 245);">

    <!-- Restaurant Header -->
    <header style="background-color:#8B0000; color:white; text-align:center; padding:25px;">
        <h1>Tasty Bites Restaurant</h1>
        <p>Good Food Makes a Better Mood</p>
    </header>

    <!-- Special Dishes -->
    <section style="padding:25px;">
        <h2 style="text-align:center; color:#8B0000;">
            Our Special Dishes
        </h2>

        <table style="width:100%; border-collapse:collapse; text-align:center;">

            <tr style="background-color:rgb(255, 165, 0); color:white;">
                <th style="padding:12px; border:1px solid black;">Dish Name</th>
                <th style="padding:12px; border:1px solid black;">Type</th>
                <th style="padding:12px; border:1px solid black;">Price</th>
            </tr>

            <tr style="background-color:white;">
                <td style="padding:12px; border:1px solid #999;">Margherita Pizza</td>
                <td style="padding:12px; border:1px solid #999;">Veg</td>
                <td style="padding:12px; border:1px solid #999;">₹249</td>
            </tr>

            <tr style="background-color:#fff0f0;">
                <td style="padding:12px; border:1px solid #999;">Paneer Butter Masala</td>
                <td style="padding:12px; border:1px solid #999;">Veg</td>
                <td style="padding:12px; border:1px solid #999;">₹279</td>
            </tr>

            <tr style="background-color:white;">
                <td style="padding:12px; border:1px solid #999;">Chicken Biryani</td>
                <td style="padding:12px; border:1px solid #999;">Non-Veg</td>
                <td style="padding:12px; border:1px solid #999;">₹299</td>
            </tr>

            <tr style="background-color:#fff0f0;">
                <td style="padding:12px; border:1px solid #999;">Chocolate Brownie</td>
                <td style="padding:12px; border:1px solid #999;">Dessert</td>
                <td style="padding:12px; border:1px solid #999;">₹149</td>
            </tr>

        </table>
    </section>

    <!-- Promotional Message -->
    <section style="background-color:rgb(255, 210, 220); text-align:center; padding:25px;">
        <h2 style="color:#8B0000;">
            Visit Us & Enjoy Delicious Food!
        </h2>
    </section>

    <!-- Footer -->
    <footer style="background-color:#222222; color:white; padding:20px;">
        <p style="text-align:left;">Open Daily: 11 AM – 11 PM</p>
        <p style="text-align:right;">Thank You</p>
    </footer>

</body>
</html>
